name: Testler

on: [push, pull_request]

jobs:
  pytest:
    strategy:
      # Bir platformun kırılması ötekini iptal etmesin: üçünün de sonucunu
      # görmek istiyoruz.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # windows-latest'te 'run:' varsayılanı PowerShell'dir; aşağıdaki adımlar
    # ise bash (set +e, PIPESTATUS, tee, awk). Git Bash Windows runner'larında
    # kurulu, bu yüzden üç platform da aynı betikleri koşabiliyor.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyQt6 wheel'i Qt kütüphanelerini getirir ama onların bağlı olduğu
      # SİSTEM kütüphaneleri Linux runner'ında kurulu değil. Bunlar olmadan
      # testler 'could not load the Qt platform plugin' ile kırılır --
      # offscreen platformda bile. macOS'ta Qt bunlara ihtiyaç duymaz.
      - name: Qt sistem kütüphaneleri ve fontlar (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fontconfig fonts-dejavu-core fonts-liberation

      # Linux runner'ında varsayılan olarak MONOSPACE font yok ve
      # styleHint(Monospace) fontconfig'in takma adına güveniyor. macOS'ta
      # fontconfig hiç yok (Qt CoreText kullanır), o yüzden bu kontrol
      # yalnız Linux'ta anlamlı.
      - name: Monospace font var mı (Linux)
        if: runner.os == 'Linux'
        run: |
          fc-list : family spacing | grep -i "mono" | head -5
          fc-match monospace

      - name: Bağımlılıklar
        run: pip install -r requirements-dev.txt

      # Kırılan testleri ::error:: ile annotation olarak yayınlıyoruz: iş
      # log'ları GitHub API'sinden kimlik doğrulaması ister, annotation'lar
      # public depolarda doğrulamasız okunur.
      - name: Testler
        env:
          QT_QPA_PLATFORM: offscreen
          # Çıktı canlı aksın: '>' ile dosyaya yönlendirilen bir koşu ASILI
          # kalırsa GitHub'ın canlı logu bomboş olur ve hangi testte
          # kilitlendiği hiç öğrenilemez (macOS'ta tam bu oldu: 6 saatlik
          # sınıra kadar sıfır bilgi).
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          # faulthandler_timeout: tek bir test 120 saniyeyi aşarsa pytest TÜM
          # iş parçacıklarının yığın izini basıp süreci sonlandırır. Asılı
          # kalan bir koşuyu 6 saat beklemek yerine 2 dakikada, üstelik
          # nerede kilitlendiğini söyleyerek kırar.
          # '-q' DEĞİL: sıkışık kip her testi bir nokta olarak basar ve satır
          # 72 karakteri doldurana kadar GitHub'ın loguna hiçbir şey düşmez.
          # Asılı kalan koşuda bu, kilitlenen testi 72'lik bir pencereye kadar
          # belirsiz bırakıyordu. '-v' her testi kendi satırına yazar.
          python -m pytest -v --tb=short -rf -o faulthandler_timeout=60 2>&1 | tee pytest-cikti.txt
          KOD=${PIPESTATUS[0]}
          if [ $KOD -ne 0 ]; then
            OZET=$(grep -E "^(FAILED|ERROR)" pytest-cikti.txt | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest kırıldı (${{ matrix.os }})::${OZET}"
          fi
          exit $KOD
