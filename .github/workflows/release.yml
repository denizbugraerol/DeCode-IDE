name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # gh release create için

jobs:
  build:
    strategy:
      # Bir platformun kırılması ötekinin build'ini iptal etmesin; ikisinin de
      # sonucunu görmek istiyoruz. Release job'ı yine de ikisini birden
      # bekliyor (aşağıdaki 'needs'), yani eksik bir sürüm yayınlanmaz.
      fail-fast: false
      matrix:
        include:
          # Bilinçli olarak 'ubuntu-latest' DEĞİL: binary, üzerinde derlendiği
          # glibc'yi taban alır. Eski image = düşük taban = daha çok dağıtım.
          # Ölçüldü: paketlenmiş kütüphanelerin istediği en yüksek sürüm
          # GLIBC_2.35, yani Ubuntu 22.04+ / Debian 12+.
          - os: ubuntu-22.04
            ad: linux-x86_64
          # macos-latest Apple Silicon (arm64). Intel Mac'ler için ayrı bir
          # macos-13 satırı gerekirdi; bilinçli olarak kapsam dışı.
          - os: macos-latest
            ad: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt sistem kütüphaneleri ve fontlar (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fontconfig fonts-dejavu-core fonts-liberation

      - name: Bağımlılıklar
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --clean --noconfirm packaging/decode.spec

      # Bozuk bir binary yayınlanmasın: bu adım kırılırsa Release HİÇ
      # oluşturulmaz. Tag 'v0.1.2', binary çıktısı 'DeCode IDE 0.1.2' --
      # karşılaştırma baştaki 'v' atılarak yapılıyor.
      #
      # Başarısızlıklar AÇIKÇA 'exit 1' ile bildiriliyor: kabuğun 'set -e'
      # davranışına güvenen bir kapı, son komut başarılı olduğunda sessizce
      # açık kalır.
      - name: Duman testi
        run: |
          BINARY=$(ls dist/DeCode-*)
          chmod +x "$BINARY"
          ls -lh "$BINARY"

          if ! CIKTI=$(QT_QPA_PLATFORM=offscreen "$BINARY" --version); then
            echo "::error title=Duman testi (${{ matrix.ad }})::binary çalışmadı"
            exit 1
          fi

          BEKLENEN="DeCode IDE ${GITHUB_REF_NAME#v}"
          echo "çıktı   : $CIKTI"
          echo "beklenen: $BEKLENEN"
          if [ "$CIKTI" != "$BEKLENEN" ]; then
            echo "::error title=Duman testi (${{ matrix.ad }})::sürüm uyuşmuyor -- core/version.py ile tag farklı"
            exit 1
          fi

          # Adın platformu taşıdığını doğrula: .spec bunu sys.platform ve
          # platform.machine()'den türetiyor, yanlış runner'a düşersek burada
          # yakalanır.
          case "$BINARY" in
            *${{ matrix.ad }}) echo "ad doğru: $BINARY" ;;
            *) echo "::error title=Duman testi::beklenen ad '*${{ matrix.ad }}', bulunan '$BINARY'"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: DeCode-${{ matrix.ad }}
          path: dist/DeCode-*
          if-no-files-found: error

  release:
    # İkisi de başarılı olmadan Release oluşmaz: yarım bir sürüm (yalnız
    # Linux, ya da yalnız macOS) yayınlamak, sessizce eksik bir şey dağıtmak
    # olurdu. Bir platform kırılırsa tag durur, düzeltip yeniden etiketleriz.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: varliklar

      - name: Toplanan varlıklar
        run: ls -lhR varliklar

      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" varliklar/*/DeCode-* \
            --title "DeCode IDE $GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTLAR'
          ## Kurulum

          ### Linux (x86_64)

          ```bash
          chmod +x DeCode-*-linux-x86_64
          ./DeCode-*-linux-x86_64
          ```

          glibc 2.35+ gerekir (Ubuntu 22.04+, Debian 12+, Fedora, Arch),
          Wayland ya da X11 oturumu. `/tmp` sisteminizde `noexec` ise:
          `TMPDIR=~/.cache ./DeCode-*-linux-x86_64`

          ### macOS (Apple Silicon)

          ```bash
          chmod +x DeCode-*-macos-arm64
          xattr -d com.apple.quarantine DeCode-*-macos-arm64
          ./DeCode-*-macos-arm64
          ```

          Binary imzasız olduğu için macOS ilk açılışta karantinaya alır;
          yukarıdaki `xattr` satırı bunu kaldırır (ya da Finder'da sağ tık →
          Aç). Kod imzalama ve notarization bilinçli olarak yapılmıyor.

          **macOS derlemesi otomatik testlerden geçiyor, ancak elle
          denenmedi** — geri bildirim memnuniyetle karşılanır.

          Python, pip ya da bağımlılık kurulumu gerekmez.
          Değişiklikler için `CHANGELOG.md`'ye bakın.
          NOTLAR
          )"
